name: NetHunter hlte (SM-N9005) kernel build + RTL8812AU module

# دستورالعمل اعمال:
#   این فایل باید در همین مخزن (فورک شخصی، نه مخزن اصلی 0x4E0x650x6F)
#   روی شاخه‌ی nethunter-rtl8812au-build قرار داشته باشه.
#   از تب Actions گیت‌هاب، به‌صورت دستی (workflow_dispatch) اجرا می‌شه.
#
# این workflow دو چیز تولید می‌کنه:
#   1) zImage برای کرنل hlte-eur-los (LineageOS 14.1) — دقیقاً همون کرنلی که
#      NetHunter رسمی برای این دستگاه/ROM منتشر کرده (defconfig: lineage_hlte_pn547_defconfig
#      که CONFIG_MACH_HLTEEUR=y داره، تأیید شده با مقایسه‌ی سه defconfig موجود).
#   2) ماژول خارج‌از‌درخت rtl8812au.ko (درایور Realtek نسخه‌ی 4.3.14، از فورک
#      DiegoGuidaF/rtl8812AU کامیت 688f6ac5e412ecfa074d33d95e9c11202f301d95،
#      که طبق مستندات خودش روی کرنل‌های 3.2 تا 4.6 کامپایل شده — کرنل ما 3.4.113 است)
#      که پشتیبانی چیپ RTL8812AU (آداپتور Alfa AWUS036ACH) و RTL8821AU رو می‌ده،
#      به‌صورت ماژول بارگذاری‌شونده (insmod/modprobe)، نه کامپایل‌شده داخل خودِ zImage.

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Branch/tag of the kernel repo to build"
        required: false
        default: "nethunter-rtl8812au-build"
      localversion:
        description: "LOCALVERSION suffix embedded in the kernel string"
        required: false
        default: "-NetHunter-hlte-rtl8812au"
      driver_ref:
        description: "Commit of DiegoGuidaF/rtl8812AU to build against"
        required: false
        default: "688f6ac5e412ecfa074d33d95e9c11202f301d95"

permissions:
  contents: write

concurrency:
  group: nethunter-hlte-rtl8812au-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.kernel_ref }}
          fetch-depth: 1
          persist-credentials: false
          path: kernel

      - name: Record build metadata
        working-directory: kernel
        run: |
          # file-mode changes (chmod +x tools/dtbTool) must not append "-dirty" to the
          # kernel release string; module vermagic has to equal the zImage's exactly.
          git config core.fileMode false
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev \
            libncurses5-dev git curl ca-certificates \
            device-tree-compiler \
            libc6:i386 libstdc++6:i386 libncurses5:i386 zlib1g:i386

      # این کرنل 3.4/arm32 قدیمی است و با GCC جدید سیستم build نمی‌شود؛
      # طبق مستندات رسمی Kali برای دستگاه‌های پیش از arm64، از
      # prebuilt arm-eabi-4.7 گوگل استفاده می‌شود.
      - name: Fetch legacy arm-eabi-4.7 toolchain
        run: |
          # The default branch (main/master) of this googlesource repo was
          # emptied to an OWNERS-only placeholder. The real prebuilt
          # toolchain binaries live at the pre-deprecation commit, still
          # reachable via old release branches/tags (e.g. kitkat-release).
          git clone --depth 1 --branch kitkat-release \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-eabi-4.7 \
            "${RUNNER_TEMP}/toolchain"
          chmod +x "${RUNNER_TEMP}/toolchain/bin/"* || true
          echo "CROSS_COMPILE=${RUNNER_TEMP}/toolchain/bin/arm-eabi-" >> "$GITHUB_ENV"

      - name: Configure (lineage_hlte_pn547_defconfig)
        working-directory: kernel
        env:
          ARCH: arm
          SUBARCH: arm
        run: |
          mkdir -p out
          make O=out ARCH=arm lineage_hlte_pn547_defconfig
          # Extra Wi-Fi drivers built STATICALLY INTO zImage (AWUS036H=RTL8187,
          # RT73, RT2800USB) instead of as loadable .ko modules: this is the
          # "plug in and it just works, no insmod/loadwifi step" behavior the
          # user's older hand-built kernel had (that zip shipped zero .ko
          # files and do.modules=0 - everything was compiled in). We copy
          # that property here for the in-tree drivers.
          cat >> out/.config <<'CFGEOF'
          CONFIG_MAC80211=y
          CONFIG_RTL8187=y
          CONFIG_RT2X00=y
          CONFIG_RT73USB=y
          CONFIG_RT2800USB=y
          CFGEOF
          sed -i 's/^          //' out/.config
          yes "" | make O=out ARCH=arm oldconfig > oldconfig.log 2>&1 || true
          grep -E "^CONFIG_(MAC80211|RTL8187|RT2X00|RT73USB|RT2800USB)=" out/.config

      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm
          SUBARCH: arm
        run: |
          set -o pipefail
          make O=out ARCH=arm -j"$(nproc)" \
            HOSTCFLAGS="-fcommon" \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            LOCALVERSION="${{ github.event.inputs.localversion }}" 2>&1 | tee build.log

      - name: Dump kernel build log tail on failure (as annotation, log storage is unreachable)
        if: failure()
        working-directory: kernel
        run: |
          python3 - <<'PYEOF'
          import re
          with open("build.log", "r", errors="replace") as f:
              lines = f.readlines()

          # With -j parallel make, the real failure is usually buried well
          # before the end (many unrelated compiles keep running after it).
          # Find the FIRST line that looks like a real error and show
          # context around it, instead of just the tail.
          err_re = re.compile(r'error:|Error \d|\*\*\* \[|undefined reference|No such file or directory|fatal error', re.IGNORECASE)
          first_err_idx = None
          for i, line in enumerate(lines):
              if err_re.search(line):
                  first_err_idx = i
                  break

          chunks = []
          if first_err_idx is not None:
              start = max(0, first_err_idx - 15)
              end = min(len(lines), first_err_idx + 40)
              chunks.append("FIRST ERROR CONTEXT (lines %d-%d of %d):\n" % (start, end, len(lines)))
              chunks.append("".join(lines[start:end]))
          chunks.append("\n--- LOG TAIL ---\n")
          chunks.append("".join(lines[-30:]))

          text = "".join(chunks)
          text = text[-3800:]
          text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error::KERNEL BUILD LOG:%0A{text}")
          PYEOF

      - name: Verify kernel output exists
        working-directory: kernel
        run: |
          test -f out/arch/arm/boot/zImage || { echo "::error::zImage not produced"; exit 1; }
          file out/arch/arm/boot/zImage
          ls -lh out/arch/arm/boot/zImage

      # dtb.img (QCDT, page size 2048) is what the Samsung/Qualcomm bootloader selects a
      # device tree from; build it from the same tree so zImage and DT always match.
      - name: Build dtb.img
        working-directory: kernel
        run: |
          set -o pipefail
          # tools/dtbTool is a 32-bit x86 ELF stored without the exec bit (exit 126 otherwise)
          chmod +x tools/dtbTool
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libc6:i386 libstdc++6:i386 libgcc-s1:i386
          make O=out ARCH=arm HOSTCFLAGS="-fcommon" dtbs 2>&1 | tee dtbs.log
          find out/arch/arm/boot -name '*.dtb' | sort
          ./tools/dtbTool -s 2048 -p out/scripts/dtc/ -o dtb.img out/arch/arm/boot/ 2>&1 | tee dtbtool.log
          ls -l dtb.img

      - name: Dump dtb build tail on failure
        if: failure()
        working-directory: kernel
        run: |
          python3 - <<'PYEOF'
          import os
          text = ""
          for n in ("dtbs.log", "dtbtool.log"):
              if os.path.exists(n):
                  text += f"== {n} ==\n" + open(n, errors="replace").read()[-1800:] + "\n"
          text = (text or "no dtb logs")[-3800:]
          text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error::DTB LOG:%0A{text}")
          PYEOF

      - name: Prepare kernel for external module build
        working-directory: kernel
        run: |
          set -o pipefail
          make O=out ARCH=arm HOSTCFLAGS="-fcommon" LOCALVERSION="${{ github.event.inputs.localversion }}" modules_prepare 2>&1 | tee modules_prepare.log

      - name: Dump modules_prepare log on failure
        if: failure()
        working-directory: kernel
        run: |
          python3 - <<'PYEOF'
          with open("modules_prepare.log", "r", errors="replace") as f:
              text = f.read()
          text = text[-3800:]
          text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error::MODULES_PREPARE LOG:%0A{text}")
          PYEOF

      - name: Fetch rtl8812au driver source (pinned commit)
        run: |
          # Back on DiegoGuidaF/rtl8812AU (vendor 4.3.14): the aircrack-ng
          # fork needs cfg80211 structs this 3.4.113 kernel doesn't have at
          # all (cfg80211_chan_def/NL80211_CHAN_WIDTH_80P80 - added ~2014+),
          # a dead end. Debugging the ORIGINAL driver's channel-set path
          # instead (see patch step below): it logically looks correct
          # (reaches set_channel_bwmode -> rtw_hal_set_chnl_bw -> HW), so
          # add unconditional printk probes to see where it actually goes
          # on-device, since the driver's own DBG_871X macro is a silent
          # no-op unless built with -DCONFIG_DEBUG.
          git init rtl8812au
          cd rtl8812au
          git remote add origin https://github.com/DiegoGuidaF/rtl8812AU.git
          git fetch --depth 1 origin "${{ github.event.inputs.driver_ref }}"
          git checkout FETCH_HEAD
          echo "DRIVER_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"


      - name: Patch in unconditional channel-set debug probes
        run: |
          python3 - <<'PYEOF2'
          import re
          p = "rtl8812au/os_dep/linux/ioctl_cfg80211.c"
          s = open(p).read()
          old = "	int chan_target = (u8) ieee80211_frequency_to_channel(chan->center_freq);"
          new = ('	int chan_target = (u8) ieee80211_frequency_to_channel(chan->center_freq);\n'
                 '	printk(KERN_ERR "CHDBG: cfg80211_rtw_set_channel called, target_ch=%d type=%d\\n", chan_target, channel_type);')
          assert old in s, "probe 1 anchor not found"
          s = s.replace(old, new, 1)
          open(p, "w").write(s)

          p = "rtl8812au/hal/rtl8812a/rtl8812a_phycfg.c"
          s = open(p).read()
          old = "	if(pHalData->bSwChnl)\n	{\n		pHalData->CurrentChannel=ChannelNum;\n		pHalData->CurrentCenterFrequencyIndex1 = ChannelNum;\n	}"
          new = ('	printk(KERN_ERR "CHDBG: Handle ch=%d bSwitch=%d bSetBW=%d bSwChnl=%d bSetChnlBW=%d stopped=%d removed=%d\\n",'
                 ' ChannelNum, bSwitchChannel, bSetBandWidth, pHalData->bSwChnl, pHalData->bSetChnlBW,'
                 ' pDefAdapter->bDriverStopped, pDefAdapter->bSurpriseRemoved);\n'
                 + old)
          assert old in s, "probe 2 anchor not found"
          s = s.replace(old, new, 1)
          open(p, "w").write(s)

          p = "rtl8812au/core/rtw_wlan_util.c"
          s = open(p).read()
          old = "	rtw_hal_set_chnl_bw(padapter, center_ch, bwmode, channel_offset, chnl_offset80); // set center channel"
          new = ('	printk(KERN_ERR "CHDBG: set_channel_bwmode ch=%d center_ch=%d offset=%d bw=%d\\n", channel, center_ch, channel_offset, bwmode);\n'
                 + old)
          assert old in s, "probe 3 anchor not found"
          s = s.replace(old, new, 1)
          open(p, "w").write(s)
          print("patched 3 probes OK")
          PYEOF2

      - name: Fix monitor TX radiotap length check (real injection bug)
        # The driver drops every injected packet whose radiotap header isn't
        # exactly 14 bytes. aireplay-ng/aircrack-ng build their own radiotap
        # header with a different length, so every injected frame was
        # silently dropped before transmission - this, not channel-set, is
        # the actual injection bug (confirmed via the CHDBG probes above:
        # channel-set correctly reaches hardware). rtap_len is already the
        # real, correctly parsed header length from the kernel's own
        # ieee80211_get_radiotap_len(), already bounds-checked against
        # skb->len two lines earlier, so the fixed-14 check is just removed.
        run: |
          python3 - <<'PYEOF3'
          p = "rtl8812au/os_dep/linux/ioctl_cfg80211.c"
          s = open(p).read()

          old = ('	if(rtap_len != 14)\n'
                 '	{\n'
                 '		DBG_8192C("radiotap len (should be 14): %d\\n", rtap_len);\n'
                 '		goto fail;\n'
                 '	}	\n')
          new = '	printk(KERN_ERR "CHDBG: monitor TX rtap_len=%d (was hard-rejected unless ==14)\\n", rtap_len);\n'
          assert old in s, "radiotap-len anchor not found"
          s = s.replace(old, new, 1)

          # The three earlier "goto fail" checks have NO logging at all, so
          # if aireplay-ng's packets are being dropped before even reaching
          # the rtap_len line above (no "monitor TX rtap_len=" seen in dmesg
          # during a real injection test), we can't tell which of these three
          # is the real culprit. Instrument function entry and each one.
          # DBG_871X(FUNC_NDEV_FMT...) alone is NOT unique (used in ~17 other
          # functions in this file) - anchor on the unique declarations right
          # above it in THIS function instead, or we'd silently patch the
          # wrong function.
          old2 = ('	struct ieee80211_radiotap_header *rtap_hdr;\n'
                  '	_adapter *padapter = (_adapter *)rtw_netdev_priv(ndev);\n'
                  '	\n'
                  '	DBG_871X(FUNC_NDEV_FMT"\\n", FUNC_NDEV_ARG(ndev));\n')
          assert old2 in s, "entry anchor not found"
          assert s.count(old2) == 1, "entry anchor not unique"
          s = s.replace(
              old2,
              old2 + '	printk(KERN_ERR "CHDBG: monitor xmit ENTRY skb_len=%d\\n", skb ? skb->len : -1);\n',
              1,
          )

          old3 = ('	if (unlikely(skb->len < sizeof(struct ieee80211_radiotap_header)))\n'
                  '		goto fail;\n')
          assert old3 in s, "len-check anchor not found"
          s = s.replace(
              old3,
              '	if (unlikely(skb->len < sizeof(struct ieee80211_radiotap_header))) {\n'
              '		printk(KERN_ERR "CHDBG: monitor xmit FAIL too-short skb_len=%d need>=%d\\n",\n'
              '			skb->len, (int)sizeof(struct ieee80211_radiotap_header));\n'
              '		goto fail;\n'
              '	}\n',
              1,
          )

          old4 = ('	rtap_hdr = (struct ieee80211_radiotap_header *)skb->data;\n'
                  '	if (unlikely(rtap_hdr->it_version))\n'
                  '		goto fail;\n')
          assert old4 in s, "it_version anchor not found"
          s = s.replace(
              old4,
              '	rtap_hdr = (struct ieee80211_radiotap_header *)skb->data;\n'
              '	if (unlikely(rtap_hdr->it_version)) {\n'
              '		printk(KERN_ERR "CHDBG: monitor xmit FAIL it_version=%d (want 0)\\n",\n'
              '			rtap_hdr->it_version);\n'
              '		goto fail;\n'
              '	}\n',
              1,
          )

          old5 = ('	rtap_len = ieee80211_get_radiotap_len(skb->data);\n'
                  '	if (unlikely(skb->len < rtap_len))\n'
                  '		goto fail;\n')
          assert old5 in s, "rtap_len-bounds anchor not found"
          s = s.replace(
              old5,
              '	rtap_len = ieee80211_get_radiotap_len(skb->data);\n'
              '	if (unlikely(skb->len < rtap_len)) {\n'
              '		printk(KERN_ERR "CHDBG: monitor xmit FAIL skb_len=%d < rtap_len=%d\\n",\n'
              '			skb->len, rtap_len);\n'
              '		goto fail;\n'
              '	}\n',
              1,
          )

          # Trace which branch the frame takes after the radiotap header is
          # stripped: DATA (goes out via _rtw_xmit_entry - what aireplay-ng
          # injection should hit), MGMT/ACTION (different path), or the
          # silent "frame_ctl=0x%x" else-branch that just frees the skb and
          # returns 0 with ZERO visible logging today (DBG_8192C is a no-op).
          old6 = '\t\tret = _rtw_xmit_entry(skb, padapter->pnetdev);\n\n\t\treturn ret;\n'
          assert old6 in s, "xmit-entry anchor not found"
          s = s.replace(
              old6,
              '\t\tprintk(KERN_ERR "CHDBG: monitor xmit DATA frame -> _rtw_xmit_entry, pktlen=%d\\n", skb->len);\n'
              '\t\tret = _rtw_xmit_entry(skb, padapter->pnetdev);\n'
              '\t\tprintk(KERN_ERR "CHDBG: monitor xmit _rtw_xmit_entry returned %d\\n", ret);\n\n'
              '\t\treturn ret;\n',
              1,
          )

          old7 = '\telse\n\t{\n\t\tDBG_8192C("frame_ctl=0x%x\\n", frame_ctl & (RTW_IEEE80211_FCTL_FTYPE|RTW_IEEE80211_FCTL_STYPE));\n\t}\n'
          assert old7 in s, "else-branch anchor not found"
          s = s.replace(
              old7,
              '\telse\n\t{\n'
              '\t\tprintk(KERN_ERR "CHDBG: monitor xmit DROPPED (not DATA, not MGMT/ACTION) frame_ctl=0x%x\\n",\n'
              '\t\t\tframe_ctl & (RTW_IEEE80211_FCTL_FTYPE|RTW_IEEE80211_FCTL_STYPE));\n'
              '\t}\n',
              1,
          )

          open(p, "w").write(s)
          print("patched radiotap-len check + full entry/early-exit/branch tracing OK")
          PYEOF3

      - name: Fix TX power reporting stubs (get_tx_power was hardcoded to 12)
        # cfg80211_rtw_get_txpower() always returned a hardcoded 12, and the
        # HAL function it should delegate to (PHY_GetTxPowerLevel8812) is
        # "#if 0"-disabled dead code in the vendor source, referencing a
        # struct (Adapter->MgntInfo) that does not exist in this codebase -
        # it was never finished upstream. set_tx_power is left alone as a
        # genuine no-op: writing raw per-rate calibration indices without an
        # RF meter risks an incorrect/unsafe value with no way here to
        # verify it. See .github/scripts/patch_txpower.py for exactly what
        # this changes and why (reports the real per-rate calibration index
        # the driver already computes and programs for the current channel,
        # labeled as an estimate, not a verified dBm figure).
        run: |
          set +e
          python3 kernel/.github/scripts/patch_txpower.py > patch_txpower.log 2>&1
          rc=$?
          cat patch_txpower.log
          if [ $rc -ne 0 ]; then
            TXT=$(tail -c 3000 patch_txpower.log | python3 -c "import sys; t=sys.stdin.read().replace(chr(37),'%25').replace(chr(13),'').replace(chr(10),'%0A'); print(t)")
            echo "::error::PATCH_TXPOWER FAILED rc=$rc :%0A$TXT"
            exit 1
          fi

      - name: Build rtl8812au.ko external module
        run: |
          set -o pipefail
          KDIR="$GITHUB_WORKSPACE/kernel/out"
          # The driver Makefile only defines obj-$(CONFIG_RTL8821AU) when invoked
          # through its own outer "make" (which exports CONFIG_RTL8821AU=m).
          # We call kbuild directly, so pass the symbol explicitly; otherwise
          # kbuild finds nothing to build and "succeeds" with no .ko produced.
          # CC is overridden to bypass scripts/gcc-wrapper.py, which turns any
          # non-whitelisted warning into a fatal error (this vendor driver has many).
          make -C "$KDIR" M="$GITHUB_WORKSPACE/rtl8812au" \
            ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" \
            CC="${CROSS_COMPILE}gcc" \
            LOCALVERSION="${{ github.event.inputs.localversion }}" \
            CONFIG_RTL8821AU=m \
            CONFIG_PLATFORM_I386_PC=n \
            USER_EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211 -DRTW_USE_CFG80211_STA_EVENT" \
            modules 2>&1 | tee module-build.log

      - name: Show module-build.log tail (always, for debugging)
        if: always()
        run: |
          python3 - <<'PYEOF'
          import os
          if not os.path.exists("module-build.log"):
              print("::notice::module-build.log missing")
              raise SystemExit(0)
          with open("module-build.log", "r", errors="replace") as f:
              text = f.read()
          text = text[-2500:]
          text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::notice::MODULE BUILD LOG TAIL (always):%0A{text}")
          PYEOF

      - name: Dump module build log tail on failure (as annotation, log storage is unreachable)
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import re, os
          if not os.path.exists("module-build.log"):
              print("::notice::module-build.log does not exist (failure happened before this step ran)")
              raise SystemExit(0)
          with open("module-build.log", "r", errors="replace") as f:
              lines = f.readlines()
          err_re = re.compile(r'error:|Error \d|\*\*\* \[|undefined reference|No such file or directory|fatal error', re.IGNORECASE)
          first_err_idx = None
          for i, line in enumerate(lines):
              if err_re.search(line):
                  first_err_idx = i
                  break
          chunks = []
          if first_err_idx is not None:
              start = max(0, first_err_idx - 15)
              end = min(len(lines), first_err_idx + 40)
              chunks.append("FIRST ERROR CONTEXT (lines %d-%d of %d):\n" % (start, end, len(lines)))
              chunks.append("".join(lines[start:end]))
          chunks.append("\n--- LOG TAIL ---\n")
          chunks.append("".join(lines[-30:]))
          text = "".join(chunks)
          text = text[-3800:]
          text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error::MODULE BUILD LOG:%0A{text}")
          PYEOF

      - name: List rtl8812au build directory (always, for debugging)
        if: always()
        run: |
          echo "::notice::rtl8812au dir listing:%0A$(find rtl8812au -maxdepth 1 -name '*.ko' -o -maxdepth 1 -name '*.o' -o -maxdepth 1 -name 'Module.symvers' -o -maxdepth 1 -name '.*.cmd' 2>/dev/null | tr '\n' ' ')"
          find rtl8812au -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' '
          echo ""
          ls -la rtl8812au/*.ko 2>&1 || true
          ls -la rtl8812au/ | head -60

      - name: Verify module output exists
        run: |
          test -f rtl8812au/8812au.ko || { echo "::error::8812au.ko not produced"; exit 1; }
          "${CROSS_COMPILE}strip" --strip-unneeded rtl8812au/8812au.ko
          file rtl8812au/8812au.ko
          ls -lh rtl8812au/8812au.ko

      # insmod rejects a module whose vermagic differs from the running kernel's
      # release string, so never ship a pair that doesn't match.
      - name: Verify module vermagic matches zImage release string
        run: |
          python3 - <<'PYEOF'
          import re, lzma, sys
          z = open("kernel/out/arch/arm/boot/zImage", "rb").read()
          kern = None
          for m in re.finditer(rb"\xfd7zXZ\x00", z):
              try:
                  out = lzma.LZMADecompressor().decompress(z[m.start():])
              except Exception:
                  continue
              v = re.search(rb"Linux version (\S+)", out)
              if v:
                  kern = v.group(1).decode(); break
          import glob
          mods = ["rtl8812au/8812au.ko"] + sorted(glob.glob("kernel/out/**/*.ko", recursive=True))
          print("zImage release :", kern)
          bad = False
          for f in mods:
              m = re.search(rb"vermagic=(\S+)", open(f, "rb").read())
              m = m.group(1).decode() if m else None
              ok = bool(kern) and kern == m
              print(("OK   " if ok else "BAD  ") + f + "  " + str(m))
              if not ok:
                  bad = True
          if bad or not kern:
              print(f"::error::VERSION MISMATCH (zImage={kern}); see log")
              sys.exit(1)
          print("OK: all module vermagics match kernel release")
          PYEOF

      - name: Write build-info.txt
        if: always()
        run: |
          {
            echo "kernel_commit: ${KERNEL_COMMIT}"
            echo "kernel_ref: ${{ github.event.inputs.kernel_ref }}"
            echo "driver_commit: ${DRIVER_COMMIT:-unknown}"
            echo "build_date: ${BUILD_DATE}"
            echo "defconfig: lineage_hlte_pn547_defconfig"
            echo "cross_compile: arm-eabi-4.7"
            echo "localversion: ${{ github.event.inputs.localversion }}"
          } > build-info.txt

      - name: Upload build logs (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            kernel/build.log
            module-build.log
          retention-days: 14

      # Artifact/log downloads are blocked in the author's environment, so also
      # publish the binaries to an orphan branch that can be fetched with plain git.
      - name: Publish binaries to build-artifacts branch (only on success)
        if: success()
        run: |
          mkdir -p publish
          cp kernel/out/arch/arm/boot/zImage publish/zImage
          cp rtl8812au/8812au.ko publish/8812au.ko
          mkdir -p publish/modules
          find kernel/out -name '*.ko' -exec cp {} publish/modules/ \;
          "${CROSS_COMPILE}strip" --strip-unneeded publish/modules/*.ko || true
          ls -l publish/modules > publish/modules-list.txt
          cp build-info.txt publish/build-info.txt
          cp kernel/dtb.img publish/dtb.img
          cp kernel/.config publish/kernel.config 2>/dev/null || cp kernel/out/.config publish/kernel.config
          cd publish
          git init -q -b build-artifacts
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -q -m "Build artifacts ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/build-artifacts

      - name: Upload kernel + module artifacts (only on success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hlte-nethunter-rtl8812au
          path: |
            kernel/out/arch/arm/boot/zImage
            rtl8812au/8812au.ko
            build-info.txt
          retention-days: 30
